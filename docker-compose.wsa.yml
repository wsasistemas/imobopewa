# WSA — OpeWA em Docker (hoje no PC; depois o mesmo arquivo vai para o servidor).
# Complementa o docker-compose.yml oficial, sem mexer nele:
#   * usa a pasta ./data (a mesma do modo dev): a sessão wsa-admin, a chave de API e o banco continuam;
#   * sobe o túnel da Cloudflare junto, para o Supabase (Atendimento ONLINE do ImobAdm) alcançar a API;
#   * desliga o docker-proxy (só serve para o OpeWA criar Postgres/Redis pelo painel, que a WSA não usa).
#
# Antes de subir: pare o modo dev (dev.ps1) — a mesma sessão não pode rodar em dois lugares.
# Subir:      docker compose -f docker-compose.yml -f docker-compose.wsa.yml up -d --build
# Endereço:   docker logs openwa-tunel 2>&1 | findstr trycloudflare
#             (muda quando o túnel reinicia: atualize ADM_OPEWA_URL no Supabase com <endereço>/api)
# Parar:      docker compose -f docker-compose.yml -f docker-compose.wsa.yml down
#
# No servidor 24 h: troque o serviço "tunel" por um proxy com https (Caddy) e o domínio opewa.imobsystems.com.br.

services:
  docker-proxy:
    profiles: ['disabled']

  openwa-api:
    volumes: !override
      - ./data:/app/data
    environment:
      - TZ=America/Sao_Paulo
      # Ao reiniciar (PC ligado de novo, container reiniciado), reconecta sozinha a sessão wsa-admin.
      - AUTO_START_SESSIONS=true

  tunel:
    image: cloudflare/cloudflared:2026.10.7
    container_name: openwa-tunel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://openwa-api:2785
    networks:
      - openwa-network
    depends_on:
      openwa-api:
        condition: service_healthy
